plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.dirty.init"
        minSdk 28
        targetSdk 34
        versionCode 100
        versionName "1.00"

        ndk {
            // The exploit patches AArch64 instructions at runtime: arm64 only.
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Intentionally empty: the app uses framework classes only.
}
